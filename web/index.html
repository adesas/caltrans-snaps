<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sacramento Valley Traffic Cam Archive</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>
<header>
  <div>
    <h1>📷 Sac Valley Traffic Cam Archive</h1>
    <p class="sub">Free rolling <span id="retentionDays">3</span>-day archive of Caltrans cameras along SR-70 &amp; SR-99 (Oroville · Yuba City · Marysville). Footage courtesy of <a href="https://cwwp2.dot.ca.gov/vm/streamlist.htm" rel="noreferrer">Caltrans</a>.</p>
  </div>
  <a id="requestBtn" class="btn" target="_blank" rel="noreferrer"
     href="https://github.com/adesas/caltrans-snaps/issues/new?labels=coverage-request&title=Add+county:+%3CCounty%3E">
     ✋ Request a county</a>
</header>

<main>
  <aside id="sidebar"></aside>
  <section id="playerPane">
    <div id="playerBox">
      <video id="video" playsinline controls muted></video>
      <div id="clock"></div>
      <div id="noSel">← pick a camera</div>
    </div>
    <div id="controls">
      <label>Day <input type="date" id="dayPick"></label>
      <button class="btn" id="nowBtn">⏺ Now</button>
      <div id="hourBar"></div>
    </div>
    <div id="exportBar">
      <button class="btn" id="exportBtn">⬇ Export</button>
      <label>Range
        <select id="exportRange">
          <option value="clip" selected>Clip from playhead</option>
          <option value="hour">Whole hour</option>
        </select>
      </label>
      <label id="lenLabel">Length
        <input type="number" id="exportLen" min="0.5" max="60" step="0.5" value="5">
        min
      </label>
      <label id="vttLabel" title="same-named WebVTT sidecar: VLC/mpv auto-load it and show the wall clock as subtitles">
        <input type="checkbox" id="exportVtt" checked> .vtt clock
      </label>
      <span id="exportRangeHint"></span>
      <span id="exportStatus"></span>
    </div>
    <div id="camMeta"></div>
  </section>
</main>

<footer>Recordings are stored locally and served as HLS. Not affiliated with Caltrans.</footer>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
